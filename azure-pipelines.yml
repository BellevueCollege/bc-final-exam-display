# PHP

trigger:
  branches:
    include:
      - trunk
  paths:
    exclude:
      - azure-pipelines.yml
pr:
  branches:
    include:
      - trunk
      - release-v*
      - hotfix-v*
pool:
    vmImage: ubuntu-latest

variables:
    npm_config_cache: $(Pipeline.Workspace)/.npm

steps:
  - task: UseNode@1
    inputs:
      version: '24.x'
    displayName: 'Install Node.js 24'
  - script: npm install -g npm@11.16.0
    displayName: 'Force functinal NPM version'
  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)
    displayName: Cache npm
  - task: Npm@1
    inputs:
      command: 'ci'
    displayName: NPM Clean Install
  - task: Npm@1
    inputs:
      command: 'custom'
      customCommand: 'run build'
    displayName: NPM Build
  - task: Npm@1
    inputs:
      command: 'custom'
      customCommand: 'ci --omit=dev'
    displayName: NPM Prune Dev Deps
  - task: replacetokens@6
    inputs:
      sources: 'bc-final-exam-display.php'
      addBOM: true
  - task: DeleteFiles@1
    inputs:
      SourceFolder:
      Contents: |
        /.git
        /.git*
      RemoveDotFiles: true
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Pipeline.Workspace)'
      artifact: 'bc-final-exam-display'
      publishLocation: 'pipeline'
